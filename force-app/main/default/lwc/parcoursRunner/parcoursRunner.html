<template>
    <lightning-card title={cardTitle} icon-name="standard:flow">
        <template lwc:if={canChangeParcours}>
            <lightning-button
                slot="actions"
                label="Changer de parcours"
                icon-name="utility:back"
                onclick={handleBackToPicker}
            ></lightning-button>
        </template>
        <div class="slds-p-horizontal_medium slds-p-bottom_medium">
            <!-- Sélection du parcours par tuiles (aucun code configuré) -->
            <template lwc:if={isPicker}>
                <lightning-input
                    type="search"
                    label="Rechercher un parcours"
                    variant="label-hidden"
                    placeholder="Rechercher un parcours (nom, code, catégorie)…"
                    value={searchTerm}
                    onchange={handleSearch}
                    class="slds-m-bottom_small"
                ></lightning-input>

                <template lwc:if={hasTiles}>
                    <ul class="tile-grid" aria-label="Parcours disponibles">
                        <template for:each={filteredTiles} for:item="tile">
                            <li key={tile.parcoursId}>
                                <button
                                    type="button"
                                    class="tile slds-box"
                                    data-code={tile.code}
                                    title={tile.name}
                                    onclick={handleSelectParcours}
                                >
                                    <span class="tile-header">
                                        <lightning-icon
                                            icon-name="standard:flow"
                                            size="small"
                                            alternative-text=""
                                        ></lightning-icon>
                                        <span class="tile-name">{tile.name}</span>
                                    </span>
                                    <span class="tile-meta">
                                        <span class="tile-code">{tile.code}</span>
                                        <span>{tile.versionLabel}</span>
                                    </span>
                                    <template lwc:if={tile.categorie}>
                                        <lightning-badge label={tile.categorie} class="tile-badge"></lightning-badge>
                                    </template>
                                </button>
                            </li>
                        </template>
                    </ul>
                </template>

                <template lwc:if={showNoTiles}>
                    <p class="slds-text-color_weak slds-p-vertical_small">{noTilesMessage}</p>
                </template>
            </template>

            <!-- Chargement -->
            <template lwc:if={isLoading}>
                <lightning-spinner alternative-text="Chargement" size="small"></lightning-spinner>
            </template>

            <!-- Erreur -->
            <template lwc:if={errorMessage}>
                <div class="slds-text-color_error slds-p-vertical_x-small" role="alert">
                    {errorMessage}
                </div>
            </template>

            <!-- Parcours terminé -->
            <template lwc:if={isComplete}>
                <div class="slds-box slds-theme_success slds-m-top_small" role="status">
                    <lightning-icon
                        icon-name="utility:success"
                        alternative-text="Terminé"
                        size="small"
                        class="slds-m-right_x-small"
                    ></lightning-icon>
                    Parcours terminé.
                </div>
                <template lwc:if={canChangeParcours}>
                    <lightning-button
                        label="Démarrer un autre parcours"
                        variant="brand"
                        onclick={handleBackToPicker}
                        class="slds-m-top_small"
                    ></lightning-button>
                </template>
            </template>

            <!-- Nœud courant -->
            <template lwc:if={node}>
                <h2 class="slds-text-heading_small slds-m-bottom_small">{node.name}</h2>

                <template lwc:if={node.texte}>
                    <lightning-formatted-rich-text
                        value={node.texte}
                        class="slds-m-bottom_small"
                    ></lightning-formatted-rich-text>
                </template>

                <!-- Champs de saisie -->
                <template lwc:if={hasChamps}>
                    <div class="slds-form slds-m-vertical_small">
                        <template for:each={node.champs} for:item="champ">
                            <lightning-input
                                key={champ.champId}
                                data-id={champ.champId}
                                label={champ.libelle}
                                type={champ.inputType}
                                onchange={handleInputChange}
                                class="slds-m-bottom_x-small"
                            ></lightning-input>
                        </template>
                    </div>
                </template>

                <!-- Transitions : embranchement -->
                <template lwc:if={isBranching}>
                    <div class="slds-button-group-row slds-m-top_small">
                        <template for:each={node.transitions} for:item="transition">
                            <lightning-button
                                key={transition.transitionId}
                                data-id={transition.transitionId}
                                label={transition.libelleReponse}
                                variant="brand"
                                onclick={handleTransition}
                                class="slds-m-right_x-small slds-m-bottom_x-small"
                            ></lightning-button>
                        </template>
                    </div>
                </template>

                <!-- Transition : nœud linéaire -->
                <template lwc:if={hasSingleTransition}>
                    <lightning-button
                        label="Suivant"
                        variant="brand"
                        onclick={handleNext}
                        class="slds-m-top_small"
                    ></lightning-button>
                </template>

                <!-- Aiguillage vers un sous-parcours -->
                <template lwc:if={isNavigationJump}>
                    <lightning-button
                        label={navigationLabel}
                        variant="brand"
                        icon-name="utility:forward"
                        onclick={handleNavigate}
                        class="slds-m-top_small"
                    ></lightning-button>
                </template>
            </template>
        </div>
    </lightning-card>
</template>
